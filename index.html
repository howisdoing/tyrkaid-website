<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyrkaid Machinery - 橡胶与塑料机械专业制造商</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #333; line-height: 1.6; background-color: #f9f9f9; }
        header { background: #1a1a1a; color: #fff; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 24px; font-weight: 600; letter-spacing: 1px; }
        nav a { color: #ccc; text-decoration: none; margin-left: 20px; font-size: 14px; transition: color 0.2s; cursor: pointer; }
        nav a:hover { color: #fff; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .hero { background: #2c3e50; color: white; padding: 60px 40px; border-radius: 8px; margin-bottom: 40px; }
        .hero h2 { font-size: 32px; margin-bottom: 15px; }
        .hero p { font-size: 16px; color: #cbd5e1; max-width: 700px; }
        
        .section-title { font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        
        /* 产品网格 */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-info h3 { font-size: 18px; margin-bottom: 10px; color: #1e293b; }
        .product-info p { font-size: 14px; color: #64748b; margin-bottom: 20px; flex-grow: 1; }
        .btn { display: inline-block; background: #2563eb; color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none; font-size: 14px; text-align: center; transition: background 0.2s; cursor: pointer; border: none; }
        .btn:hover { background: #1d4ed8; }

        footer { text-align: center; padding: 40px 0; color: #94a3b8; font-size: 13px; border-top: 1px solid #e2e8f0; margin-top: 60px; }
    </style>
</head>
<body>

    <header>
        <h1>Tyrkaid Machinery</h1>
        <nav>
            <a onclick="showView('home')">首页 (Home)</a>
            <a onclick="showView('products')">产品中心 (Products)</a>
            <a href="/admin/" target="_blank">管理后台 (CMS)</a>
        </nav>
    </header>

    <div class="container">
        <!-- 首页视图 -->
        <div id="home" class="view-section">
            <div class="hero">
                <h2>专业橡胶与塑料加工设备制造商</h2>
                <p>专注于密炼机、开炼机、压延机及定制化橡胶塑料机械生产与全球出口，为您提供卓越的工业解决方案。</p>
            </div>
        </div>

        <!-- 产品中心视图 -->
        <div id="products" class="view-section" style="display:none;">
            <h3 class="section-title">核心产品系列</h3>
            <div class="product-grid" id="product-list-container">
                <!-- 示例产品卡片 -->
                <div class="product-card">
                    <div class="product-info">
                        <h3>开放式炼胶机 (Open Mixing Mill)</h3>
                        <p>高耐磨辊筒，精密调距，满足各类橡胶开炼与混炼需求。</p>
                        <button class="btn" onclick="showView('detail')">查看详情</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 产品详情视图 -->
        <div id="detail" class="view-section" style="display:none;">
            <h3 class="section-title">产品详细参数</h3>
            <p>此处展示具体参数与配置说明...</p>
            <br>
            <button class="btn" onclick="showView('products')">返回产品列表</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Dongguan Tyrkaid Machinery Co., Ltd. All Rights Reserved.
    </footer>

    <!-- 完整的视图切换控制逻辑 -->
    <script>
        function showView(viewId) {
            // 隐藏所有视图模块
            const sections = document.querySelectorAll('.view-section');
            sections.forEach(section => {
                section.style.display = 'none';
            });
            
            // 显示目标视图模块
            const target = document.getElementById(viewId);
            if (target) {
                target.style.display = 'block';
                window.scrollTo(0, 0);
            }
        }
    </script>
</body>
</html>
